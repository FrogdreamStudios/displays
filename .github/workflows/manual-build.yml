name: Manual Build

# Maintainer-triggered build for native libraries and Minecraft loader jars.
# The reusable build workflow owns the platform/version matrix.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Build only the Linux native target and all loader versions
        required: false
        default: false
        type: boolean
      retention_days:
        description: Number of days to retain the downloaded build bundle
        required: false
        default: 7
        type: number

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      pull_request: ${{ inputs.pull_request }}

  collect:
    name: Collect build artifacts
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: build/native
          merge-multiple: true

      - name: Download loader jars
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: build-jars-*
          path: build/libs
          merge-multiple: true

      - name: Create build manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Version: %s\n' '${{ needs.build.outputs.pretty_version }}'
            printf 'Commit: %s\n' '${{ github.sha }}'
            printf 'Workflow run: %s\n' '${{ github.run_id }}'
            printf 'Native platforms: %s\n' '${{ needs.build.outputs.required_native_platforms }}'
            printf '\nArtifacts:\n'
            find build -type f -printf '%P\n' | sort
          } > build/MANIFEST.txt

      - name: Upload manual build bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dreamdisplays-manual-${{ github.run_number }}
          path: build
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}